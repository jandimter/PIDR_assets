<text x='39.87' y='616.96' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='512.77px' lengthAdjust='spacingAndGlyphs'>Fuente: Observatorio Social, MDSF. Datos: comunas de la Región de Arica y Parinacota, 2021 vs. 2018. Cada celda muestra cuántas</text>
<text x='39.87' y='631.30' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='534.48px' lengthAdjust='spacingAndGlyphs'>personas vivían en la comuna de su fila en 2018 y viven en la comuna de su columna en 2021, considerando solo traslados dentro de la</text>
<text x='39.87' y='645.64' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='558.92px' lengthAdjust='spacingAndGlyphs'>misma región. La diagonal (misma comuna) se deja en blanco porque no es un traslado. Comunas ordenadas de mayor a menor según el total</text>
<text x='39.87' y='659.98' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='535.08px' lengthAdjust='spacingAndGlyphs'>de personas que salen de cada una hacia el resto de la región (no geográficamente). Por resguardo de privacidad, los valores menores a</text>
<text x='39.87' y='674.32' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='535.27px' lengthAdjust='spacingAndGlyphs'>20 personas se muestran como «&lt;20». Color en escala raíz cuadrada para que los flujos más chicos sigan siendo visibles junto a los más</text>
<text x='39.87' y='688.66' style='font-size: 9.96px;fill: #666666; font-family: "PIDR gobCL"; font-weight: 300;' textLength='33.44px' lengthAdjust='spacingAndGlyphs'>grandes.</text>
